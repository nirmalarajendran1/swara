<title>Swara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F6FF; --surface:#FFFFFF; --surface-2:#F0EAFF;
    --ink:#241B3D; --ink-soft:#6E6285;
    --accent:#7C3AED; --accent-ink:#FFFFFF;
    --accent-2:#A3E635; --accent-2-text:#4D7C0F; --accent-2-ink:#1F2937;
    --border:#E4DBFF; --shadow:rgba(45,20,80,0.10);
    --success:#16A34A; --success-bg:#DCFCE7;
    --retry:#DC2626; --retry-bg:#FEE2E2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#160F27; --surface:#20172E; --surface-2:#2A1F3D;
      --ink:#F3EEFF; --ink-soft:#B7A8D6;
      --accent:#A78BFA; --accent-ink:#1E1033;
      --accent-2:#BEF264; --accent-2-text:#BEF264; --accent-2-ink:#1A2E05;
      --border:#3D2E56; --shadow:rgba(0,0,0,0.45);
      --success:#4ADE80; --success-bg:#14251A;
      --retry:#F87171; --retry-bg:#3A1616;
    }
  }
  :root[data-theme="dark"]{
    --paper:#160F27; --surface:#20172E; --surface-2:#2A1F3D;
    --ink:#F3EEFF; --ink-soft:#B7A8D6;
    --accent:#A78BFA; --accent-ink:#1E1033;
    --accent-2:#BEF264; --accent-2-text:#BEF264; --accent-2-ink:#1A2E05;
    --border:#3D2E56; --shadow:rgba(0,0,0,0.45);
    --success:#4ADE80; --success-bg:#14251A;
    --retry:#F87171; --retry-bg:#3A1616;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    padding:24px 16px 48px; margin:0;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Poppins','DM Sans',sans-serif; text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  .app-shell{max-width:480px; margin:0 auto;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .wordmark{font-family:'Poppins',sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:0.01em; display:flex; align-items:center; gap:8px;}
  .wordmark svg{width:22px; height:22px;}
  .streak-pill{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-weight:700; font-size:0.9rem; font-variant-numeric:tabular-nums;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:26px; padding:28px 24px; box-shadow:0 10px 28px var(--shadow); position:relative; overflow:hidden; animation:cardIn .35s ease both;}
  .stage{display:flex; flex-direction:column; gap:16px;}
  @keyframes cardIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .card{animation:none;} }

  .eyebrow{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:700;}

  /* ---- Mascot ---- */
  .mascot-badge{
    width:104px; height:104px; border-radius:50%; margin:0 auto;
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent-2) 45%, transparent), transparent 62%), var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    animation:mascotBob 2.8s ease-in-out infinite;
  }
  .mascot-hero{display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; margin-bottom:2px;}
  @keyframes mascotBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
  @media (prefers-reduced-motion: reduce){ .mascot-badge{animation:none;} }
  .mascot-row{display:flex; align-items:center; gap:12px;}
  .mascot-row .mascot-badge{width:52px; height:52px; margin:0; flex-shrink:0;}
  .mascot-row.small .mascot-badge{width:40px; height:40px;}
  .speech-bubble{
    position:relative; background:var(--surface-2); border-radius:14px; padding:11px 15px;
    font-size:0.92rem; font-weight:600; line-height:1.35; flex:1;
  }
  .speech-bubble::before{
    content:''; position:absolute; left:-5px; top:18px; width:11px; height:11px;
    background:var(--surface-2); transform:rotate(45deg); border-radius:2px;
  }

  .hero-title{font-size:1.55rem; margin-top:2px;}
  .hero-tagline{color:var(--ink-soft); font-size:0.95rem; line-height:1.5; margin-top:2px;}

  .step-progress{display:flex; gap:6px; margin:18px 0 22px;}
  .step-dot{height:5px; flex:1; border-radius:3px; background:var(--surface-2);}
  .step-dot.done{background:var(--accent);}

  .q-title{font-size:1.35rem; font-weight:600; margin-bottom:4px;}
  .q-sub{color:var(--ink-soft); font-size:0.92rem; margin-bottom:14px;}

  .option-list{display:flex; flex-direction:column; gap:10px;}
  .option-card{
    text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:16px;
    padding:14px 16px; cursor:pointer; transition:border-color .15s, transform .12s;
    display:flex; flex-direction:column; gap:2px;
  }
  .option-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .option-card:active{transform:scale(0.98);}
  .option-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .option-card .opt-title{font-weight:700; font-size:1rem;}
  .option-card .opt-sub{color:var(--ink-soft); font-size:0.85rem;}

  .lang-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .lang-card{
    background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:14px;
    cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:4px; transition:border-color .15s, transform .12s;
  }
  .lang-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .lang-card:active{transform:scale(0.98);}
  .lang-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .lang-native{font-weight:600; font-size:1.15rem;}
  .lang-en{color:var(--ink-soft); font-size:0.8rem;}
  .lang-group-label{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:700; margin:14px 0 8px;}
  .lang-group-label:first-child{margin-top:0;}

  .btn{
    border:none; border-radius:999px; padding:13px 22px; font-weight:700; font-size:0.98rem;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; transition:transform .12s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent; color:var(--accent); border:1.5px solid var(--border);}
  .btn-text{background:none; border:none; color:var(--ink-soft); font-size:0.85rem; text-decoration:underline; cursor:pointer; width:auto; padding:4px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{width:auto; flex:1;}

  .comeback-banner{
    background:linear-gradient(135deg, var(--accent-2) 0%, color-mix(in srgb, var(--accent-2) 75%, var(--surface)) 100%);
    color:var(--accent-2-ink); border-radius:20px; padding:18px 20px; margin-bottom:16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .comeback-banner .cb-eyebrow{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; font-weight:800; opacity:0.75;}
  .comeback-banner h3{font-size:1.15rem;}
  .comeback-banner p{margin:0; font-size:0.92rem; line-height:1.45;}
  .comeback-banner .mascot-badge{background:rgba(255,255,255,0.35);}

  .home-headline{font-size:1.5rem; margin-bottom:2px;}
  .home-sub{color:var(--ink-soft); font-size:0.92rem; margin-bottom:18px;}
  .home-lang-tile{
    display:flex; align-items:center; gap:14px; background:var(--surface-2); border:none; border-radius:16px;
    padding:14px 16px; margin-bottom:18px; width:100%; text-align:left; cursor:pointer;
    font-family:inherit; color:var(--ink); transition:transform .12s ease, background .15s;
  }
  .home-lang-tile:hover{background:color-mix(in srgb, var(--accent) 10%, var(--surface-2));}
  .home-lang-tile:active{transform:scale(0.98);}
  .home-lang-tile:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .home-lang-tile .native{font-size:1.5rem; font-weight:600;}
  .home-lang-tile .tile-info{flex:1;}
  .home-lang-tile .meta{color:var(--ink-soft); font-size:0.82rem;}
  .home-lang-tile .tile-chevron{color:var(--ink-soft); flex-shrink:0;}

  .session-progress-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; font-size:0.85rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .session-bar{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-bottom:20px;}
  .session-bar-fill{height:100%; background:var(--accent); transition:width .3s;}

  .vocab-stage{text-align:center; padding:8px 0 4px;}
  .vocab-script{font-size:2.4rem; font-weight:600; line-height:1.25; margin-bottom:6px;}
  .font-deva{font-family:'Noto Sans Devanagari',sans-serif;}
  .font-tam{font-family:'Noto Sans Tamil',sans-serif;}
  .font-tel{font-family:'Noto Sans Telugu',sans-serif;}
  .font-mal{font-family:'Noto Sans Malayalam',sans-serif;}
  .font-kan{font-family:'Noto Sans Kannada',sans-serif;}
  .font-jp{font-family:'Noto Sans JP',sans-serif;}
  .font-sc{font-family:'Noto Sans SC',sans-serif;}
  .font-latin{font-family:'Poppins',sans-serif;}
  .vocab-translit{color:var(--ink-soft); font-size:1.02rem; margin-bottom:2px;}
  .vocab-meaning{font-size:0.98rem; color:var(--ink-soft);}
  .vocab-meaning.gloss-en{font-style:italic;}
  .vocab-meaning .meaning-sub{font-size:0.8rem; opacity:0.8;}

  .voice-row{display:flex; gap:10px; margin-top:22px;}
  .voice-btn{
    flex:1; border-radius:18px; border:1.5px solid var(--border); background:var(--surface-2);
    padding:16px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
    font-weight:700; font-size:0.88rem; color:var(--ink); transition:transform .12s ease;
  }
  .voice-btn:active{transform:scale(0.97);}
  .voice-btn svg{width:26px; height:26px;}
  .voice-btn.mic-btn{border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); color:var(--accent);}
  .voice-btn.listening{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--accent);}
  .voice-btn.listening svg{animation:micPulse 0.9s ease-in-out infinite;}
  @keyframes micPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  @media (prefers-reduced-motion: reduce){ .voice-btn.listening svg{animation:none;} }

  .voice-note{font-size:0.78rem; color:var(--ink-soft); margin-top:10px; text-align:center; line-height:1.4;}

  .feedback-row{margin-top:16px;}
  .feedback-row .speech-bubble.correct{background:var(--success-bg); color:var(--success);}
  .feedback-row .speech-bubble.correct::before{background:var(--success-bg);}
  .feedback-row .speech-bubble.retry{background:var(--retry-bg); color:var(--retry);}
  .feedback-row .speech-bubble.retry::before{background:var(--retry-bg);}

  .self-check-row{display:flex; gap:10px; margin-top:16px;}

  .summary-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:18px 0 22px;}
  .stat-tile{background:var(--surface-2); border-radius:16px; padding:14px 8px; text-align:center;}
  .stat-num{font-family:'Poppins',sans-serif; font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; display:block;}
  .stat-label{font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}

  .milestone-panel{
    background:linear-gradient(135deg, var(--accent-2) 0%, color-mix(in srgb, var(--accent-2) 70%, var(--surface)) 100%);
    color:var(--accent-2-ink); border-radius:18px; padding:16px 18px; margin:14px 0; font-weight:700; text-align:center;
  }

  .confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none; border-radius:inherit;}
  .confetti i{position:absolute; top:-12px; width:7px; height:11px; border-radius:2px; opacity:0.95; animation:confettiFall 1000ms ease-in forwards;}
  @keyframes confettiFall{ to{ transform:translateY(160px) rotate(220deg); opacity:0; } }

  .modal-backdrop{position:fixed; inset:0; background:rgba(10,15,17,0.5); display:flex; align-items:flex-end; justify-content:center; padding:16px; z-index:10;}
  .modal-sheet{background:var(--surface); border-radius:24px; padding:22px; width:100%; max-width:448px; max-height:82vh; overflow-y:auto;}

  @media (max-width:400px){
    .card{padding:22px 16px;}
    .vocab-script{font-size:2rem;}
    .lang-grid{grid-template-columns:1fr 1fr;}
  }
</style>

  function loadProfile(){ try{ return JSON.parse(localStorage.getItem(PROFILE_KEY)); }catch(e){ return null; } }
  function saveProfile(p){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }catch(e){} }
  function loadProgress(){
    try{
      var p = JSON.parse(localStorage.getItem(PROGRESS_KEY));
      if(p) return p;
    }catch(e){}
    return {streak:0, lastActiveDate:null, totalCorrect:0, wordStats:{}, cursors:{}};
  }
  function saveProgress(p){ try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){} }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function langByCode(code){ for(var i=0;i<LANGUAGES.length;i++){ if(LANGUAGES[i].code===code) return LANGUAGES[i]; } return LANGUAGES[0]; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function prefersReducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

  var ONBOARD_STEPS = ['intent','language','baseLang','level','goal','motivation'];

  function computeComeback(){
    var p = state.progress;
    if(!p.lastActiveDate) return null;
    var gap = daysBetween(p.lastActiveDate, todayStr());
    if(gap >= 2) return gap;
    return null;
  }

  function getFlatWords(langCode){
    var flat = [];
    VOCAB[langCode].forEach(function(cat){
      cat.words.forEach(function(w){
        flat.push({id:langCode+'-'+flat.length, script:w[0], translit:w[1], en:w[2], category:cat.label, flatIndex:flat.length});
      });
    });
    return flat;
  }

  // A German learner shouldn't have to know English to learn Hindi. Because every
  // language's word list is built in the same order (see VOCAB above), word #7 always
  // means the same thing everywhere — so we can show the learner's OWN language as the
  // meaning instead of assuming English, just by looking up the same index elsewhere.
  function meaningFor(word, baseLangCode){
    if(!baseLangCode || baseLangCode === 'en'){
      return {text: word.en, native:false};
    }
    var baseWord = getFlatWords(baseLangCode)[word.flatIndex];
    if(!baseWord) return {text: word.en, native:false};
    return {text: baseWord.script, sub: baseWord.translit, native:true, font: langByCode(baseLangCode).font};
  }

  function peekUpcomingCategory(langCode){
    var flat = getFlatWords(langCode);
    var cursor = (state.progress.cursors && state.progress.cursors[langCode]) || 0;
    return flat[cursor % flat.length].category;
  }

  function pickSessionWords(langCode, comebackMode){
    var flat = getFlatWords(langCode);
    var stats = state.progress.wordStats;

    if(comebackMode){
      var byWeak = flat.slice().sort(function(a,b){
        var sa = stats[a.id] || {correct:0, incorrect:0};
        var sb = stats[b.id] || {correct:0, incorrect:0};
        return (sb.incorrect - sb.correct) - (sa.incorrect - sa.correct);
      });
      return byWeak.slice(0, Math.min(5, flat.length));
    }

    // Rotate through the whole pool so every new session starts where the last one left off,
    // instead of always re-picking the same slice (that was the "day 2 repeats day 1" bug).
    var sessionSize = Math.min(GOAL_MINUTES[(state.profile && state.profile.dailyGoal) || 5] || 8, flat.length);
    if(!state.progress.cursors) state.progress.cursors = {};
    var cursor = state.progress.cursors[langCode] || 0;
    var picked = [];
    for(var i=0;i<sessionSize;i++){ picked.push(flat[(cursor+i) % flat.length]); }
    state.progress.cursors[langCode] = (cursor + sessionSize) % flat.length;
    saveProgress(state.progress);
    return picked;
  }

  // ---------- Speech ----------
  var voicesCache = [];
  function refreshVoices(){ try{ voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }catch(e){} }
  if(window.speechSynthesis){
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
  function speak(text, speechLang, onNoVoice){
    if(!window.speechSynthesis){ if(onNoVoice) onNoVoice(); return; }
    try{
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = speechLang;
      var prefix = speechLang.split('-')[0];
      var match = voicesCache.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; });
      if(match.length){ utter.voice = match[0]; } else if(onNoVoice){ onNoVoice(); }
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }catch(e){ if(onNoVoice) onNoVoice(); }
  }

  function getRecognitionCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }

  function normalize(s){ return String(s).trim().toLowerCase().replace(/[.,!?¡¿。，、]/g,''); }

  function fuzzyMatch(expected, heard){
    var e = normalize(expected), h = normalize(heard);
    if(!h) return false;
    if(h === e) return true;
    if(h.indexOf(e) !== -1 || e.indexOf(h) !== -1) return true;
    return false;
  }

    size = size || 64;
    var eyes, mouth;
    if(mood === 'sleepy'){
      eyes = '<path d="M23 27q3 3 6 0M35 27q3 3 6 0" stroke="var(--paper)" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      mouth = '<path d="M27 40q5 3 10 0" stroke="var(--paper)" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    } else if(mood === 'excited'){
      eyes = '<circle cx="26" cy="27" r="3.2" fill="var(--paper)"/><circle cx="38" cy="27" r="3.2" fill="var(--paper)"/>';
      mouth = '<path d="M24 37q8 11 16 0" stroke="var(--paper)" stroke-width="3" fill="none" stroke-linecap="round"/>';
    } else if(mood === 'soft'){
      eyes = '<circle cx="26" cy="27" r="2.6" fill="var(--paper)"/><circle cx="38" cy="27" r="2.6" fill="var(--paper)"/>';
      mouth = '<path d="M27 39q5 2 10 0" stroke="var(--paper)" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    } else {
      eyes = '<circle cx="26" cy="27" r="3" fill="var(--paper)"/><circle cx="38" cy="27" r="3" fill="var(--paper)"/>';
      mouth = '<path d="M25 38q7 6 14 0" stroke="var(--paper)" stroke-width="3" fill="none" stroke-linecap="round"/>';
    }
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" style="fill:var(--accent)"/>'+eyes+mouth+'</svg>';
  }

  function mascotBadge(mood, size){
    return '<div class="mascot-badge" style="width:'+size+'px;height:'+size+'px;">'+mascotSvg(mood, Math.round(size*0.82))+'</div>';
  }

  function mascotBubble(mood, text, small){
    return '<div class="mascot-row'+(small?' small':'')+'">'+mascotBadge(mood, small?40:52)+'<div class="speech-bubble">'+text+'</div></div>';

  function stepDots(total, doneIdx){

  function optionCard(field, value, title, sub){
    return '<button class="option-card" data-action="pick-'+field+'" data-value="'+value+'"><span class="opt-title">'+title+'</span><span class="opt-sub">'+sub+'</span></button>';
  }

  function wireOnboarding(){
    app.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', function(){
        var action = el.getAttribute('data-action');
        var value = el.getAttribute('data-value');
        if(action === 'pick-intent'){ state.draft.intent = value; advanceOnboarding(); }
        else if(action === 'pick-lang'){ state.draft.targetLang = value; advanceOnboarding(); }
        else if(action === 'pick-baseLang'){ state.draft.baseLang = value; advanceOnboarding(); }
        else if(action === 'pick-level'){ state.draft.level = value; advanceOnboarding(); }
        else if(action === 'pick-goal'){ state.draft.dailyGoal = parseInt(value,10); advanceOnboarding(); }
        else if(action === 'pick-motivation'){ finishOnboarding(value); }
      });
    });
  }

  function finishOnboarding(motivationValue){
    state.draft.motivation = motivationValue;
    state.profile = state.draft;
    saveProfile(state.profile);

    // Self-rated level gives a real starting point, not just flavour text:
    // "some" skips past the absolute-beginner set, "rusty" skips further still.
    var lang = state.profile.targetLang;
    var essentialsLen = VOCAB[lang][0].words.length;
    var numbersLen = VOCAB[lang][1].words.length;
    var flatLen = getFlatWords(lang).length;
    var startCursor = 0;
    if(state.profile.level === 'some'){ startCursor = essentialsLen; }
    else if(state.profile.level === 'rusty'){ startCursor = essentialsLen + numbersLen; }
    if(!state.progress.cursors) state.progress.cursors = {};
    state.progress.cursors[lang] = startCursor % flatLen;
    saveProgress(state.progress);

    state.view = 'dashboard';
    render();
  }

  function advanceOnboarding(){ state.onboardingStep++; render(); }

  function renderDashboard(){
    var lang = langByCode(state.profile.targetLang);
    var baseName = state.profile.baseLang === 'en' ? 'English' : langByCode(state.profile.baseLang).name;
    var comebackGap = computeComeback();
    var mot = MOTIVATION_COPY[state.profile.motivation];
    var html = '<div class="topbar"><div class="wordmark">'+micSvg()+' Swara</div>';
    html += '<div class="streak-pill" style="color:var(--accent-2-text);">'+flameSvg()+' '+state.progress.streak+'</div></div>';
    html += '<div class="card"><div class="stage">';

    if(comebackGap){
      html += '<div class="comeback-banner">';
      html += '<div class="mascot-row">'+mascotBadge('sleepy', 52)+'<div><div class="cb-eyebrow">Dhun missed you</div><h3>'+comebackGap+' days away</h3></div></div>';
      html += '<p>'+mot.comeback+'</p>';
      html += '<button class="btn btn-primary" style="background:var(--surface);color:var(--accent-2-ink);" data-action="start-comeback">Start refresher</button></div>';
    } else {
      var mood = state.progress.streak >= 7 ? 'excited' : 'happy';
      var line = state.progress.streak === 0
        ? 'Ready when you are — let’s start your streak.'
        : (state.profile.intent === 'improver' ? 'Day '+state.progress.streak+'. Let’s keep that fluency warm.' : 'Day '+state.progress.streak+'. Where should we explore today?');
      html += mascotBubble(mood, line);
    }

    html += '<div class="eyebrow" style="margin-top:16px;">'+(state.profile.intent==='improver' ? 'Sharpening' : 'Exploring')+'</div>';
    html += '<button class="home-lang-tile" data-action="switch-lang"><span class="native '+lang.font+'">'+lang.native+'</span><div class="tile-info"><div style="font-weight:600;">'+lang.name+'</div><div class="meta">Meanings shown in '+baseName+' · tap to switch</div></div><span class="tile-chevron">'+chevronSvg()+'</span></button>';

    html += '<div class="home-headline">'+(state.progress.streak>0 ? 'Day '+state.progress.streak+' streak' : 'Ready for your first lesson?')+'</div>';
    html += '<div class="home-sub">Today’s set: '+peekUpcomingCategory(state.profile.targetLang)+' · '+(GOAL_MINUTES[state.profile.dailyGoal]||8)+' words · about '+state.profile.dailyGoal+' min</div>';
    html += '<button class="btn btn-primary" data-action="start-lesson">Start today’s lesson</button>';

    html += '</div></div>';
    app.innerHTML = html;

    app.querySelector('[data-action="start-lesson"]').addEventListener('click', function(){ startSession(false); });
    var cb = app.querySelector('[data-action="start-comeback"]');
    if(cb) cb.addEventListener('click', function(){ startSession(true); });
    app.querySelector('[data-action="switch-lang"]').addEventListener('click', openSwitchLang);
  }

  function resetDemo(){
    try{ localStorage.removeItem(PROFILE_KEY); localStorage.removeItem(PROGRESS_KEY); }catch(e){}
    state.profile = null;
    state.progress = loadProgress();
    state.draft = {};
    state.onboardingStep = 0;
    render();

  function openSwitchLang(){
    var html = '<div class="modal-backdrop" data-action="close-modal"><div class="modal-sheet" onclick="event.stopPropagation()">';
    html += '<div class="q-title">Switch language</div><div class="q-sub">Your progress in other languages is kept separately.</div>';
    html += '<div class="lang-grid">';
    ['Indian languages','World languages'].forEach(function(g){
      html += '<div class="lang-group-label" style="grid-column:1/-1;">'+g+'</div>';
      LANGUAGES.filter(function(l){return l.group===g;}).forEach(function(l){
        html += '<button class="lang-card" data-action="switch-to" data-value="'+l.code+'"><span class="lang-native '+l.font+'">'+l.native+'</span><span class="lang-en">'+l.name+'</span></button>';
      });
    });
    html += '</div>';
    html += '<button class="btn-text" data-action="reset-demo-modal" style="margin-top:14px;">Not you? Start over completely</button>';
    html += '</div></div>';
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    document.body.appendChild(wrap);
    wrap.querySelector('[data-action="close-modal"]').addEventListener('click', function(e){ if(e.target === e.currentTarget){ document.body.removeChild(wrap); } });
    wrap.querySelector('[data-action="reset-demo-modal"]').addEventListener('click', function(){
      document.body.removeChild(wrap);
      resetDemo();
    });
    wrap.querySelectorAll('[data-action="switch-to"]').forEach(function(el){
      el.addEventListener('click', function(){
        state.profile.targetLang = el.getAttribute('data-value');
        saveProfile(state.profile);
        document.body.removeChild(wrap);
        render();
      });
    });
  }

  function startSession(comebackMode){
    var words = pickSessionWords(state.profile.targetLang, comebackMode);
    state.session = {words:words, idx:0, comeback:comebackMode, results:[], noVoiceWarned:false, recognitionFailed:false};
    state.view = 'lesson';
    render();
  }

  function renderLesson(){
    var lang = langByCode(state.profile.targetLang);
    var s = state.session;
    var word = s.words[s.idx];
    var meaning = meaningFor(word, state.profile.baseLang);
    var html = '<div class="topbar"><div class="wordmark">'+micSvg()+' Swara</div><div class="streak-pill">'+lang.name+'</div></div>';
    html += '<div class="card"><div class="session-progress-row"><span>'+(s.comeback?'Refresher':word.category)+'</span><span>'+(s.idx+1)+' / '+s.words.length+'</span></div>';
    html += '<div class="session-bar"><div class="session-bar-fill" style="width:'+Math.round(((s.idx)/s.words.length)*100)+'%"></div></div>';

    html += '<div class="vocab-stage"><div class="vocab-script '+lang.font+'">'+escapeHtml(word.script)+'</div>';
    if(lang.font !== 'font-latin'){ html += '<div class="vocab-translit">'+escapeHtml(word.translit)+'</div>'; }
    if(meaning.native){
      html += '<div class="vocab-meaning '+meaning.font+'">'+escapeHtml(meaning.text)+' <span class="meaning-sub">('+escapeHtml(meaning.sub)+')</span></div>';
    } else {
      html += '<div class="vocab-meaning gloss-en">'+escapeHtml(meaning.text)+'</div>';
    }
    html += '</div>';

    html += '<div class="voice-row">';
    html += '<button class="voice-btn" data-action="play">'+speakerSvg()+'<span>Play</span></button>';
    var hasRecognition = !!getRecognitionCtor();
    if(hasRecognition && !s.recognitionFailed){
      html += '<button class="voice-btn mic-btn" id="mic-btn" data-action="listen">'+micSvg()+'<span>Your turn</span></button>';
    } else {
      html += '<button class="voice-btn mic-btn" data-action="self-said">'+micSvg()+'<span>I said it</span></button>';
    }
    html += '</div>';

    html += '<div id="voice-note-slot"></div>';
    html += '<div id="feedback-slot"></div>';
    html += '<div id="next-slot"></div>';

    html += '</div>';
    app.innerHTML = html;

    app.querySelector('[data-action="play"]').addEventListener('click', function(){
      speak(word.script, lang.speech, function(){
        if(!s.noVoiceWarned){
          s.noVoiceWarned = true;
          document.getElementById('voice-note-slot').innerHTML = '<div class="voice-note">Playback voice for '+lang.name+' isn’t installed in this browser. Chrome tends to have the widest language coverage — or read the transliteration aloud yourself.</div>';
        }
      });
    });

    var micBtn = app.querySelector('[data-action="listen"]');
    if(micBtn){
      micBtn.addEventListener('click', function(){ startListening(lang, word, micBtn); });
    }
    var selfBtn = app.querySelector('[data-action="self-said"]');
    if(selfBtn){
      selfBtn.addEventListener('click', function(){ showSelfCheck(word); });
    }
  }

  function startListening(lang, word, btn){
    var Ctor = getRecognitionCtor();
    if(!Ctor){ state.session.recognitionFailed = true; renderLesson(); return; }

    function noteTransient(msg){
      var slot = document.getElementById('voice-note-slot');
      if(slot) slot.innerHTML = '<div class="voice-note">'+msg+'</div>';
    }

    function begin(){
      try{
        var rec = new Ctor();
        rec.lang = lang.speech;
        rec.maxAlternatives = 3;
        btn.classList.add('listening');
        rec.onresult = function(ev){
          btn.classList.remove('listening');
          var heard = ev.results[0][0].transcript;
          var ok = fuzzyMatch(word.script, heard) || fuzzyMatch(word.translit, heard);
          showFeedback(word, ok);
        };
        rec.onerror = function(ev){
          btn.classList.remove('listening');
          var err = ev && ev.error;
          if(err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture'){
            state.session.recognitionFailed = true;
            renderLesson();
          } else {
            noteTransient('Didn’t catch that — tap the mic and try again.');
          }
        };
        rec.onend = function(){ btn.classList.remove('listening'); };
        rec.start();
      }catch(e){
        state.session.recognitionFailed = true;
        renderLesson();
      }
    }

    // Prime microphone permission explicitly first: gives a reliable permission
    // prompt across browsers, and a clear signal if mic access is blocked
    // (e.g. an embedded preview without microphone allowed) vs. just a quiet moment.
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
        stream.getTracks().forEach(function(t){ t.stop(); });
        begin();
      }).catch(function(){
        state.session.recognitionFailed = true;
        renderLesson();
      });
    } else {
      begin();
    }
  }

  function showSelfCheck(word){
    document.getElementById('voice-note-slot').innerHTML = '<div class="voice-note">Voice input isn’t available in this preview environment — it’ll use your microphone automatically once this is hosted on its own domain. For now, say it out loud, then mark yourself.</div>';
    document.getElementById('feedback-slot').innerHTML = '<div class="self-check-row"><button class="btn btn-primary" data-self="yes">Got it right</button><button class="btn btn-ghost" data-self="no">Need practice</button></div>';
    document.querySelector('[data-self="yes"]').addEventListener('click', function(){ showFeedback(word, true); });
    document.querySelector('[data-self="no"]').addEventListener('click', function(){ showFeedback(word, false); });
  }

  function showFeedback(word, ok){
    var stats = state.progress.wordStats;
    if(!stats[word.id]) stats[word.id] = {correct:0, incorrect:0};
    if(ok){ stats[word.id].correct++; } else { stats[word.id].incorrect++; }
    saveProgress(state.progress);
    state.session.results.push(ok);

    var line = ok ? pickLine(CHEER_LINES) : pickLine(NUDGE_LINES) + ' It’s <strong>' + escapeHtml(word.translit) + '</strong>.';
    var bubbleClass = ok ? 'correct' : 'retry';
    document.getElementById('feedback-slot').innerHTML =
      '<div class="feedback-row"><div class="mascot-row small">'+mascotBadge(ok?'excited':'soft', 40)+'<div class="speech-bubble '+bubbleClass+'">'+line+'</div></div></div>';

    var isLast = state.session.idx >= state.session.words.length - 1;
    document.getElementById('next-slot').innerHTML = '<button class="btn btn-primary" style="margin-top:14px;" data-action="next">'+(isLast ? 'Finish lesson' : 'Next word')+'</button>';
    document.querySelector('[data-action="next"]').addEventListener('click', function(){
      if(isLast){ finishSession(); } else { state.session.idx++; renderLesson(); }
    });
  }

  function finishSession(){
    var s = state.session;
    var correctCount = s.results.filter(Boolean).length;
    var today = todayStr();
    var p = state.progress;
    if(p.lastActiveDate !== today){
      var gap = p.lastActiveDate ? daysBetween(p.lastActiveDate, today) : 1;
      p.streak = (gap <= 1) ? p.streak + 1 : 1;
    }
    p.lastActiveDate = today;
    p.totalCorrect += correctCount;
    saveProgress(p);
    state.progress = p;
    state.view = 'summary';
    state.session.correctCount = correctCount;
    state.session.milestoneHit = MILESTONES.indexOf(p.streak) !== -1 ? p.streak : null;
    render();
  }

  function confettiMarkup(){
    if(prefersReducedMotion()) return '';
    var colors = ['var(--accent)','var(--accent-2)','var(--success)'];
    var pieces = '';
    for(var i=0;i<14;i++){
      var left = Math.round(Math.random()*100);
      var delay = Math.round(Math.random()*250);
      var color = colors[i % colors.length];
      pieces += '<i style="left:'+left+'%;background:'+color+';animation-delay:'+delay+'ms;"></i>';
    }
    return '<div class="confetti">'+pieces+'</div>';
  }

  function renderSummary(){
    var s = state.session;
    var html = '<div class="topbar"><div class="wordmark">'+micSvg()+' Swara</div></div>';
    html += '<div class="card">'+confettiMarkup()+'<div class="stage">';
    html += mascotBubble('excited', s.comeback ? 'Welcome back in full swing — that’s the streak protected.' : pickLine(['Nice work — see you tomorrow?','That’s a wrap. Feeling sharper already.','Great session. Same time tomorrow?']));
    if(s.milestoneHit){
      html += '<div class="milestone-panel">'+flameSvg()+' '+s.milestoneHit+'-day streak unlocked — I’m doing a little dance over here.</div>';
    }
    html += '<div class="summary-stats">';
    html += '<div class="stat-tile"><span class="stat-num">'+s.words.length+'</span><span class="stat-label">Practiced</span></div>';
    html += '<div class="stat-tile"><span class="stat-num">'+s.correctCount+'</span><span class="stat-label">Nailed it</span></div>';
    html += '<div class="stat-tile"><span class="stat-num" style="color:var(--accent-2-text);">'+state.progress.streak+'</span><span class="stat-label">Day streak</span></div>';
    html += '</div>';
    html += '<button class="btn btn-primary" data-action="back">Back to dashboard</button>';
    html += '</div></div>';
    app.innerHTML = html;
    app.querySelector('[data-action="back"]').addEventListener('click', function(){ state.view = 'dashboard'; state.session = null; render(); });
  }

  render();
})();
</script>
